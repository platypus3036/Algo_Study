name: Generate Daily Study Template

on:
  workflow_dispatch:
    inputs:
      date:
        description: '폴더 이름으로 사용할 날짜 (yymmdd 형식)'
        required: true
      problems:
        description: '문제와 링크 목록 (형식: 문제이름1:링크1,문제이름2:링크2)'
        required: true
        default: '문제A:https://example.com/problem/1,문제B:https://example.com/problem/2'

jobs:
  generate-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create study template
        run: |
          TARGET_DATE="${{ github.event.inputs.date }}"
          PROBLEM_LIST="${{ github.event.inputs.problems }}"
          
          mkdir -p "$TARGET_DATE"
          
          # 1. 메인 README.md 파일 내용 구성
          README_CONTENT=$(cat <<-EOF
          # 🗓️ ${TARGET_DATE} 스터디 회고

          ## 🎯 이번 주 스터디 목표 및 주요 학습 내용
          - 

          ---

          ## 📚 문제별 토론 및 회고
          EOF
          )

          # ✨ 수정된 부분: temporary.md 파일 내용 초기화
          TEMP_CONTENT=$(cat <<-EOF
          # 📝 ${TARGET_DATE} 임시 메모

          EOF
          )

          IFS=',' read -ra PROBLEMS_ARRAY <<< "$PROBLEM_LIST"

          for item in "${PROBLEMS_ARRAY[@]}"; do
            PROBLEM_NAME="${item%%:*}"
            PROBLEM_LINK="${item#*:}"
            
            PROBLEM_NAME=$(echo "$PROBLEM_NAME" | sed 's/^[ \t]*//;s/[ \t]*$//')

            # 각 문제 이름으로 폴더 생성 및 .gitkeep 파일 추가
            mkdir -p "${TARGET_DATE}/${PROBLEM_NAME}"
            touch "${TARGET_DATE}/${PROBLEM_NAME}/.gitkeep"
            
            # 메인 README.md에 문제별 상세 섹션 추가
            README_CONTENT+=$(cat <<-EOM

          ### 📝 ${PROBLEM_NAME}
          - **문제 링크**: [바로가기](${PROBLEM_LINK})
          - **난이도**: 
          - **주요 접근법 요약**: 
          - **토론 내용 및 피드백**: 
          EOM
          )

            # ✨ 수정된 부분: temporary.md에 문제 제목과 빈칸 추가
            TEMP_CONTENT+=$(cat <<-EOM

          ### ${PROBLEM_NAME}
          - 
          EOM
          )
          done

          # 메인 README.md에 하단 KPT 회고 섹션 추가
          README_CONTENT+=$(cat <<-EOF

          ---

          ## 🚀 KPT 회고 (Keep, Problem, Try)
          ### Keep (유지할 점)
          - 

          ### Problem (개선할 점)
          - 

          ### Try (다음에 시도할 점)
          - 

          ---

          ## 🗓️ 다음 주 계획
          - 
          EOF
          )

          # 완성된 내용을 각 파일에 쓰기
          echo "$README_CONTENT" > "${TARGET_DATE}/README.md"
          echo "$TEMP_CONTENT" > "${TARGET_DATE}/temporary.md"

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: Create study retrospective template for ${{ github.event.inputs.date }}"
            git push
          else
            echo "No changes to commit."
          fi
